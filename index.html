<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Alert Examples</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            .alert {
                padding: 10px;
                margin-bottom: 10px;
                color: white;
                font-family: sans-serif;
            }
            .success { background-color: #4CAF50; }
            .info { background-color: #2196F3; }
            .warning { background-color: #ff9800; }
            .danger { background-color: #f44336; }
        </style>
    </head>
    <body>
        
        <h3>Alert Examples in VS Code!!!</h3>

        <div class="alert success"><strong>Success!</strong> Bu muvaffaqiyatli xabar.</div>
        <div class="alert info"><strong>Info!</strong> Bu ma'lumot xabari.</div>
        <div class="alert warning"><strong>Warning!</strong> Bu ogohlantirish xabari.</div>
        <div class="alert danger"><strong>Danger!</strong> Bu xavfli xabar.</div>

    </body>
</html>
